@font-face { font-family:'Roobert'; src:url('/mnt/user-data/uploads/Roobert-Medium.ttf') format('truetype'); font-weight:500; font-display:swap; }
@font-face { font-family:'Roobert'; src:url('/mnt/user-data/uploads/Roobert-SemiBold.ttf') format('truetype'); font-weight:600; font-display:swap; }

:root{
  --color-daybreak:#ABB1FF; --color-cloud:#3D9CFA; --color-cobalt:#5215FC;
  --color-light-gray:#EDEDED; --color-dark-gray:#6B6B6B; --color-white:#FFFFFF; --color-black:#000000;
  --color-daybreak-dark:#858DFF; --color-daybreak-light:#DBDDFF;
  --color-cloud-dark:#006CF0; --color-cloud-light:#ADD6FF;
  --color-cobalt-dark:#00007E; --color-cobalt-light:#6244F8;
  --gradient-clear-sky:linear-gradient(to right,#ABB1FF 0%,#3D9CFA 40%,#5215FC 100%);

  --head:'RoobertS8','Hanken Grotesk',sans-serif;
  --body:'Roobert','Hanken Grotesk',sans-serif;

  /* type scale (scaled for web; ratios + tracking preserved) */
  --t-h1:clamp(40px,6vw,75px); --t-h2:43px; --t-h3:clamp(26px,4vw,32px);
  --t-h4:20px; --t-body:16px; --t-cap:12px;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--color-white);}
body{
  font-family:var(--body); font-weight:400; color:var(--color-black);
  font-size:var(--t-body); letter-spacing:-.01em; line-height:1.25;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--head);font-weight:500;text-transform:none;margin-left:-.045em;}
h1{font-size:var(--t-h1);letter-spacing:-.03em;line-height:.96;}
h2{font-size:var(--t-h2);letter-spacing:-.03em;line-height:1.04;}
h3{font-size:var(--t-h3);letter-spacing:-.02em;line-height:1.12;}
h4{font-size:var(--t-h4);letter-spacing:-.01em;line-height:1.33;}
p{font-size:var(--t-body);letter-spacing:-.01em;line-height:1.45;color:var(--color-dark-gray);}
.caption{font-size:var(--t-cap);letter-spacing:0;line-height:1.6;}
.material-symbols-outlined{font-variation-settings:'wght' 100,'FILL' 0,'GRAD' 0,'opsz' 24;}

.wrap{max-width:880px;margin:0 auto;padding:0 24px;}
.shell{min-height:100vh;display:flex;flex-direction:column;}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;max-width:880px;margin:0 auto;width:100%;}
.brand-logo{height:30px;width:auto;display:block;}
.tagline{font-family:var(--body);font-size:13px;color:var(--color-dark-gray);}

/* ---- buttons ---- */
.btn{font-family:var(--body);font-weight:600;font-size:16px;letter-spacing:-.01em;border:none;border-radius:14px;
  padding:15px 26px;cursor:pointer;transition:transform .12s ease,box-shadow .2s ease,background .2s ease;display:inline-flex;align-items:center;gap:10px;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--gradient-clear-sky);color:var(--color-white);box-shadow:0 6px 22px rgba(82,21,252,.22);}
.btn-primary:hover{box-shadow:0 10px 30px rgba(82,21,252,.30);}
.btn-secondary{background:transparent;color:var(--color-black);border:2px solid var(--color-dark-gray);}
.btn-secondary:hover{background:var(--color-light-gray);}
.btn-ghost{background:transparent;color:var(--color-dark-gray);border:2px solid var(--color-light-gray);}
.btn-ghost:hover{border-color:var(--color-dark-gray);color:var(--color-black);}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none;}
.btn .material-symbols-outlined{font-size:20px;}

/* ---- intro ---- */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 0 72px;}
.intro-panel{padding:40px 44px;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--body);font-weight:600;font-size:12px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--color-dark-gray);
  border:2px solid var(--color-light-gray);border-radius:25px;padding:8px 16px;width:max-content;}
.intro h1{margin:22px 0 18px;max-width:14ch;}
.intro .lede{font-size:19px;line-height:1.5;color:var(--color-dark-gray);max-width:56ch;margin-left:-.02em;}
.intro .support{margin-top:18px;max-width:58ch;}
.intro .accent{height:6px;width:120px;border-radius:6px;background:var(--gradient-clear-sky);margin:30px 0;}
.intro .cta-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:8px;}
.intro .micro{font-size:13px;color:var(--color-dark-gray);}
.pillars{display:flex;gap:10px;flex-wrap:wrap;margin-top:40px;}
.pillar{display:flex;align-items:center;gap:9px;background:var(--color-light-gray);border:2px solid var(--color-light-gray);
  border-radius:15px;padding:10px 15px;font-size:14px;font-weight:500;color:var(--color-black);font-family:var(--body);}
.pillar .material-symbols-outlined{font-size:20px;color:var(--color-dark-gray);}

/* ---- progress ---- */
.progress-head{padding:26px 0 6px;}
.progress-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.progress-label{font-family:var(--body);font-weight:600;font-size:14px;color:var(--color-black);}
.progress-count{font-size:13px;color:var(--color-dark-gray);}
.bar{height:8px;background:var(--color-light-gray);border-radius:8px;overflow:hidden;}
.bar > span{display:block;height:100%;border-radius:8px;background:var(--gradient-clear-sky);transition:width .4s cubic-bezier(.2,.7,.3,1);}

/* ---- reusable container (matches results cards) ---- */
.panel{border:2px solid var(--color-light-gray);border-radius:15px;background:var(--color-white);padding:24px 26px;}

/* ---- section ---- */
.section{flex:1;padding:18px 0 40px;}
.section-head{display:flex;gap:14px;align-items:flex-start;margin:14px 0 0;
  border:2px solid var(--color-light-gray);border-radius:15px;background:var(--color-white);padding:22px 24px;}
.section-icon{flex:0 0 auto;width:52px;height:52px;border-radius:15px;background:var(--color-daybreak-light);
  display:flex;align-items:center;justify-content:center;}
.section-icon .material-symbols-outlined{font-size:28px;color:var(--color-cobalt-dark);font-variation-settings:'wght' 200,'FILL' 0,'GRAD' 0,'opsz' 28;}
.section-desc{color:var(--color-dark-gray);margin-top:4px;max-width:60ch;}

.q{margin-top:14px;border:2px solid var(--color-light-gray);border-radius:15px;background:var(--color-white);padding:22px 24px;}
.q-title{font-family:var(--head);font-weight:500;font-size:21px;letter-spacing:-.01em;line-height:1.3;color:var(--color-black);margin-bottom:4px;}
.q-hint{font-size:13px;color:var(--color-dark-gray);margin-bottom:14px;}

/* option cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
.cards.freq{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}
.card{position:relative;border:2px solid var(--color-light-gray);background:var(--color-white);border-radius:15px;
  padding:14px 16px;cursor:pointer;font-family:var(--body);font-size:15px;font-weight:500;color:var(--color-black);
  transition:border-color .15s ease,background .15s ease,box-shadow .15s ease;display:flex;align-items:center;gap:10px;line-height:1.3;}
.card:hover{border-color:var(--color-daybreak-dark);}
.card .tick{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--color-light-gray);
  display:flex;align-items:center;justify-content:center;transition:all .15s ease;}
.card.checkbox .tick{border-radius:6px;}
.card .tick .material-symbols-outlined{font-size:15px;color:var(--color-white);opacity:0;font-variation-settings:'wght' 500;}
.card.selected{border-color:var(--color-cobalt);background:var(--color-daybreak-light);}
.card.selected .tick{background:var(--color-cobalt);border-color:var(--color-cobalt);}
.card.selected .tick .material-symbols-outlined{opacity:1;}

/* slider / scale */
.scale{margin-top:6px;}
.scale-track{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;position:relative;
  background:var(--color-light-gray);border-radius:14px;padding:6px;}
.scale-stop{border:none;background:transparent;cursor:pointer;padding:12px 6px;border-radius:10px;
  font-family:var(--body);font-size:13px;font-weight:600;color:var(--color-dark-gray);transition:all .15s ease;text-align:center;line-height:1.2;}
.scale-stop:hover{color:var(--color-black);}
.scale-stop.selected{background:var(--color-white);color:var(--color-cobalt-dark);box-shadow:0 2px 8px rgba(0,0,0,.10);}
.scale-ends{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--color-dark-gray);}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:42px;gap:14px;border-top:2px solid var(--color-light-gray);padding-top:22px;}
.nav .spacer{flex:1;}

/* ---- results ---- */
.results{padding:18px 0 60px;}
.res-hero{border:2px solid var(--color-light-gray);border-radius:15px;overflow:hidden;}
.res-hero-top{background:var(--gradient-clear-sky);color:var(--color-white);padding:30px 30px 28px;}
.res-hero-top .eyebrow{color:var(--color-white);border-color:rgba(255,255,255,.45);}
.res-hero-top h2{color:var(--color-white);margin:16px 0 10px;font-size:clamp(28px,4.4vw,40px);letter-spacing:-.025em;line-height:1.05;}
.res-hero-top p{color:rgba(255,255,255,.92);max-width:62ch;}
.res-summary{display:flex;flex-wrap:wrap;gap:0;border-top:2px solid rgba(255,255,255,.25);}
.res-stat{flex:1 1 30%;min-width:160px;padding:18px 30px;}
.res-stat + .res-stat{border-left:2px solid rgba(255,255,255,.25);}
.res-stat .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.85);font-weight:600;font-family:var(--body);}
.res-stat .v{font-family:var(--head);font-weight:500;font-size:22px;color:var(--color-white);margin-top:6px;letter-spacing:-.01em;}

.interp{background:var(--color-light-gray);border:2px solid var(--color-light-gray);border-radius:15px;padding:22px 24px;margin-top:18px;}
.interp p{color:var(--color-dark-gray);}

.sec-label{font-family:var(--head);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-dark-gray);margin:34px 0 14px;}
.res-cards{display:flex;flex-direction:column;gap:14px;}
.res-card{border:2px solid var(--color-light-gray);border-radius:15px;padding:20px 22px;background:var(--color-white);}
.res-card.primary{border-color:var(--color-cobalt);box-shadow:0 8px 26px rgba(82,21,252,.12);}
.res-card.secondary{border-color:var(--color-daybreak-dark);}
.res-card-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
.res-card-name{display:flex;align-items:center;gap:10px;}
.res-card-name h4{font-size:20px;color:var(--color-black);}
.flag{font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  border-radius:25px;padding:4px 10px;}
.flag.primary{background:var(--color-cobalt);color:var(--color-white);}
.flag.secondary{background:var(--color-daybreak);color:var(--color-black);}
.badge{font-family:var(--body);font-size:13px;font-weight:600;border-radius:25px;padding:6px 14px;white-space:nowrap;}
.badge.low{background:var(--color-daybreak-light);color:var(--color-cobalt-dark);}
.badge.watch{background:var(--color-daybreak);color:var(--color-black);}
.badge.active{background:var(--color-cloud);color:var(--color-white);}
.badge.priority{background:var(--color-cobalt);color:var(--color-white);}
.meter{height:8px;border-radius:8px;background:var(--color-light-gray);margin:16px 0 14px;overflow:hidden;}
.meter > span{display:block;height:100%;border-radius:8px;}
.meter > span.low{background:var(--color-daybreak);}
.meter > span.watch{background:var(--color-daybreak-dark);}
.meter > span.active{background:var(--color-cloud);}
.meter > span.priority{background:var(--color-cobalt);}
.res-card p{color:var(--color-dark-gray);}
.first-look{margin-top:12px;font-size:14px;color:var(--color-black);}
.first-look b{font-weight:600;}
.first-look span{color:var(--color-dark-gray);font-weight:400;}

/* CTA */
.cta{border:2px solid var(--color-dark-gray);border-radius:15px;padding:30px;margin-top:34px;}
.cta h3{color:var(--color-black);margin-bottom:12px;max-width:22ch;}
.cta p{max-width:64ch;}
.cta .cta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px;}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;
  padding:40px 16px;z-index:50;overflow:auto;}
.modal-back.open{display:flex;}
.modal{background:var(--color-white);border-radius:18px;max-width:520px;width:100%;padding:30px 30px 28px;position:relative;}
.modal h3{color:var(--color-black);margin-bottom:6px;}
.modal .sub{color:var(--color-dark-gray);font-size:15px;margin-bottom:20px;}
.modal-close{position:absolute;top:18px;right:18px;background:transparent;border:none;cursor:pointer;color:var(--color-dark-gray);}
.modal-close .material-symbols-outlined{font-size:24px;}
.field{margin-bottom:14px;}
.field.row{display:flex;gap:12px;}
.field.row > div{flex:1;}
label.fl{display:block;font-size:13px;font-weight:600;color:var(--color-black);margin-bottom:6px;font-family:var(--body);}
input[type=text],input[type=email],textarea{width:100%;font-family:var(--body);font-size:16px;color:var(--color-black);
  border:2px solid var(--color-light-gray);border-radius:12px;padding:12px 14px;background:var(--color-white);}
input:focus,textarea:focus{outline:none;border-color:var(--color-cobalt);}
textarea{resize:vertical;min-height:74px;}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--color-light-gray);border-radius:12px;padding:12px 14px;cursor:pointer;}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--color-cobalt);}
.check span{font-size:14px;color:var(--color-black);}
.res-preview{margin-top:12px;border:2px solid var(--color-light-gray);border-radius:12px;padding:14px;font-size:13px;color:var(--color-dark-gray);}
.res-preview b{color:var(--color-black);}
.done{text-align:center;padding:14px 0 6px;}
.done .material-symbols-outlined{font-size:46px;color:var(--color-cobalt);font-variation-settings:'wght' 200;}
.done h3{margin:12px 0 8px;}

footer{padding:22px 24px 30px;max-width:880px;margin:0 auto;width:100%;border-top:2px solid var(--color-light-gray);}
footer p{font-size:13px;color:var(--color-dark-gray);}

@media(max-width:560px){
  .res-stat + .res-stat{border-left:none;border-top:2px solid rgba(255,255,255,.25);}
  .field.row{flex-direction:column;gap:0;}
  .panel,.section-head,.q{padding-left:18px;padding-right:18px;}
  .intro-panel{padding:28px 20px;}
}
</style>

  "We are planning AI or Agentforce work":"Your results suggest it may be worth reviewing your Salesforce foundation before adding more automation or AI. A Health Check can help assess data, process, and automation readiness.",
  "We need to clean up before scaling":"Your results suggest Salesforce cleanup may be needed before more changes are added. A Health Check can help prioritize what to fix first so future work is built on a stronger foundation.",
  "We are not sure where to start":"Your results show where Salesforce may need attention first. A Health Check can help confirm the root cause and turn the findings into a clear plan."
};
var CTA_DEFAULT = "This self-assessment shows where Salesforce may be leaking value. A Stand8 Salesforce Health Check goes deeper to validate the root cause, prioritize what to fix first, and turn the findings into a practical plan.";

/* ============================ STATE ============================ */

var SECTION_ORDER = ["data","process","adoption","integrations","automation"]; // tie-break priority order
var TOTAL_STEPS = SECTIONS.length + 1; // 5 sections + personalize
var answers = {};      // qid -> value (radio/scale: option label) (checkbox: array of labels)
var screen = "intro";  // intro | <sectionId> | personalize | results
var app = document.getElementById("app");

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function labelFor(score){ for(var i=0;i<LABELS.length;i++){ if(score<=LABELS[i].max) return LABELS[i]; } return LABELS[LABELS.length-1]; }

/* ============================ SCORING ============================ */

function questionMax(q){
  if(q.type==="radio"){ var m=0; q.opts.forEach(function(o){ if(o.v>m)m=o.v; }); return m; }
  if(q.type==="scale"){ var ms=0; q.opts.forEach(function(o){ if(o.v>ms)ms=o.v; }); return ms; }
  if(q.type==="checkbox"){
    var per = (typeof q.issueScore==="number")? q.issueScore : 1;
    var issuesMax = q.issues.length * per;
    return Math.max(issuesMax, 2); // 2 accounts for "Not sure"
  }
  return 0;
}

function questionScore(q){
  var a = answers[q.id];
  if(a==null) return 0;
  if(q.type==="radio" || q.type==="scale"){
    var found=0; q.opts.forEach(function(o){ if(o.label===a) found=o.v; }); return found;
  }
  if(q.type==="checkbox"){
    if(!Array.isArray(a)) return 0;
    if(a.indexOf(q.none)>=0) return 0;
    if(a.indexOf(q.unsure)>=0) return 2;
    var per = (typeof q.issueScore==="number")? q.issueScore : 1;
    return a.length * per;
  }
  return 0;
}

function sectionScore(sec){
  var pts=0, max=0;
  sec.questions.forEach(function(q){ pts += questionScore(q); max += questionMax(q); });
  if(max===0) return 0;
  return Math.round(pts/max*100);
}

function compute(){
  var scores = SECTIONS.map(function(sec){ return {id:sec.id, title:sec.title, score:sectionScore(sec)}; });
  var overall = Math.round(scores.reduce(function(s,x){return s+x.score;},0)/scores.length);
  // rank with tie-break by SECTION_ORDER
  var ranked = scores.slice().sort(function(a,b){
    if(b.score!==a.score) return b.score-a.score;
    return SECTION_ORDER.indexOf(a.id)-SECTION_ORDER.indexOf(b.id);
  });
  return {scores:scores, overall:overall, primary:ranked[0], secondary:ranked[1], ranked:ranked};
}

/* ============================ VALIDATION ============================ */

function questionAnswered(q){
  var a=answers[q.id];
  if(q.type==="checkbox") return Array.isArray(a) && a.length>0;
  return a!=null;
}
function sectionComplete(sec){ return sec.questions.every(questionAnswered); }

/* ============================ RENDER: SECTION ============================ */

function renderSection(sec){

function refreshNav(sec){
  var n=document.getElementById("next"); if(n) n.disabled = !sectionComplete(sec);
}

function renderQuestion(q){
  var h = '<div class="q" data-q="'+q.id+'">'
    +'<div class="q-title">'+esc(q.title)+'</div>'
    + (q.hint?'<div class="q-hint">'+esc(q.hint)+'</div>':'');
  if(q.type==="radio"){
    h += '<div class="cards freq">';
    q.opts.forEach(function(o){ h += optCard(q.id,o.label,false); });
    h += '</div>';
  } else if(q.type==="checkbox"){
    h += '<div class="cards">';
    q.issues.forEach(function(lab){ h += optCard(q.id,lab,true); });
    h += optCard(q.id,q.none,true);
    h += optCard(q.id,q.unsure,true);
    h += '</div>';
  } else if(q.type==="scale"){
    h += '<div class="scale"><div class="scale-track">';
    q.opts.forEach(function(o){
      var sel = answers[q.id]===o.label ? ' selected':'';
      h += '<button type="button" class="scale-stop'+sel+'" data-q="'+q.id+'" data-val="'+esc(o.label)+'">'+esc(o.label)+'</button>';
    });
    h += '</div><div class="scale-ends"><span>'+esc(q.endLow)+'</span><span>'+esc(q.endHigh)+'</span></div></div>';
  }
  h += '</div>';
  return h;
}

function optCard(qid,label,isCheck){
  var a = answers[qid];
  var selected = isCheck ? (Array.isArray(a)&&a.indexOf(label)>=0) : (a===label);
  return '<button type="button" class="card'+(isCheck?' checkbox':'')+(selected?' selected':'')+'" '
    +'data-q="'+qid+'" data-val="'+esc(label)+'" data-check="'+(isCheck?1:0)+'">'
    +'<span class="tick"><span class="material-symbols-outlined">check</span></span>'
    +'<span>'+esc(label)+'</span></button>';
}

function findQ(qid){
  for(var i=0;i<SECTIONS.length;i++){
    var qs=SECTIONS[i].questions;
    for(var j=0;j<qs.length;j++){ if(qs[j].id===qid) return qs[j]; }
  }
  return null;
}

function wireQuestions(questions, onChange){
  app.querySelectorAll(".card").forEach(function(btn){
    btn.addEventListener("click", function(){
      var qid=btn.getAttribute("data-q"), val=btn.getAttribute("data-val"), isCheck=btn.getAttribute("data-check")==="1";
      var q=findQ(qid);
      if(!isCheck){ answers[qid]=val; }
      else {
        var arr = Array.isArray(answers[qid])? answers[qid].slice() : [];
        var isExclusive = (val===q.none || val===q.unsure);
        if(isExclusive){
          arr = (arr.length===1 && arr[0]===val) ? [] : [val]; // toggle exclusive
        } else {
          // selecting a normal issue clears exclusive answers
          arr = arr.filter(function(x){ return x!==q.none && x!==q.unsure; });
          var i=arr.indexOf(val);
          if(i>=0) arr.splice(i,1); else arr.push(val);
        }
        answers[qid]=arr;
      }
      // re-render just this question block to reflect selection state
      var block = app.querySelector('.q[data-q="'+qid+'"]');
      if(block){
        var tmp=document.createElement("div"); tmp.innerHTML=renderQuestion(q);
        block.replaceWith(tmp.firstChild);
        rewireBlock(qid,onChange);
      }
      onChange();
    });
  });
  app.querySelectorAll(".scale-stop").forEach(function(btn){
    btn.addEventListener("click", function(){ scaleClick(btn,onChange); });
  });
}

function rewireBlock(qid,onChange){
  var block=app.querySelector('.q[data-q="'+qid+'"]');
  if(!block) return;
  block.querySelectorAll(".card").forEach(function(btn){
    btn.addEventListener("click", function(){
      // delegate back through main handler by simulating same logic:
      var v=btn.getAttribute("data-val"), isCheck=btn.getAttribute("data-check")==="1", q=findQ(qid);
      if(!isCheck){ answers[qid]=v; }
      else {
        var arr=Array.isArray(answers[qid])?answers[qid].slice():[];
        var ex=(v===q.none||v===q.unsure);
        if(ex){ arr=(arr.length===1&&arr[0]===v)?[]:[v]; }
        else { arr=arr.filter(function(x){return x!==q.none&&x!==q.unsure;}); var i=arr.indexOf(v); if(i>=0)arr.splice(i,1); else arr.push(v); }
        answers[qid]=arr;
      }
      var nb=document.createElement("div"); nb.innerHTML=renderQuestion(q);
      block.replaceWith(nb.firstChild); rewireBlock(qid,onChange); onChange();
    });
  });
  block.querySelectorAll(".scale-stop").forEach(function(btn){
    btn.addEventListener("click", function(){ scaleClick(btn,onChange); });
  });
}

function scaleClick(btn,onChange){
  var qid=btn.getAttribute("data-q"), val=btn.getAttribute("data-val");
  answers[qid]=val;
  var track=btn.parentNode;
  track.querySelectorAll(".scale-stop").forEach(function(b){ b.classList.toggle("selected", b===btn); });
  onChange();
}

}

  var sec=null; SECTIONS.forEach(function(x){ if(x.id===s) sec=x; });
  if(sec){ renderSection(sec); return; }
  renderIntro();
}
